[project]
name = "sentinel360-ai"
version = "0.1.0"
description = "Sentinel360 single-stream CCTV AI pipeline (CPU-only demo scope)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "opencv-python-headless>=4.10",
  "ultralytics>=8.3",
  "numpy>=1.26",
  "httpx>=0.27",
  # SlowFast anomaly model (models/slowfast_ucfcrime_binary.pth). pytorchvideo
  # comes from git: the last PyPI release (0.1.5) predates current torch, and
  # installing it locally avoids torch.hub fetching model code from GitHub at
  # runtime.
  "torch>=2.2",
  "torchvision>=0.17",
  "pillow>=10",
  "pytorchvideo @ git+https://github.com/facebookresearch/pytorchvideo.git",
  "fvcore>=0.1.5",
  "iopath>=0.1.10",
  "fast-alpr[onnx]>=0.4.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
