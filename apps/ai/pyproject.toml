[project]
name = "sentinel360-ai"
version = "0.1.0"
description = "Sentinel360 single-stream CCTV AI pipeline (CPU-only demo scope)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "opencv-python-headless>=4.10",
  "ultralytics>=8.3",
  "numpy>=1.26",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
